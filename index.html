<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message de ton futur - JORA</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.wrap{max-width:400px;width:100%;text-align:center}
.card{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid #333;padding:30px;border-radius:28px;box-shadow:0 0 80px #00ff8822}
input{width:85%;padding:18px;border-radius:50px;border:2px solid #222;background:#000;color:#fff;text-align:center;font-size:18px;font-weight:bold;outline:none;margin:15px 0}
input:focus{border-color:#00ff88}
button{width:90%;padding:18px;border:none;border-radius:50px;background:linear-gradient(90deg,#00ff88,#00ccff);color:#000;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 10px 30px #00ff8855}
.letter{margin-top:25px;background:#fff;color:#000;padding:25px;border-radius:20px;text-align:left;position:relative;transform:rotate(-1deg);box-shadow:0 10px 40px rgba(255,255,255,0.2);animation:come 0.8s ease}
.letter:before{content:'De: Toi en 2030';position:absolute;top:-12px;left:20px;background:#00ff88;color:#000;padding:5px 15px;border-radius:50px;font-size:12px;font-weight:bold}
@keyframes come{0%{opacity:0;transform:translateY(40px) rotate(0)}100%{opacity:1;transform:translateY(0) rotate(-1deg)}}
.typing{border-right:3px solid #00ff88;white-space:pre-wrap;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1 style="margin:0">📩 MESSAGE DU FUTUR</h1>
<p style="color:#888">Ton toi de 2030 veut te parler</p>
<input id="nom" placeholder="Ton prénom">
<button onclick="recevoir()">📩 OUVRIR LE MESSAGE</button>
<div id="res"></div>
</div>
</div>

<script>
function recevoir(){
let nom=document.getElementById('nom').value.trim();
if(!nom)return alert('Mets ton prénom frère !');
let res=document.getElementById('res');
res.innerHTML='<br><p>📡 Connexion à 2030 en cours...</p>';

setTimeout(()=>{
let base=nom.length;
let messages=[
`Salut ${nom}, c'est toi, le ${nom} de 2030.\n\nJe t'écris depuis notre grande maison à Dubaï. Oui on a réussi.\n\nJe sais que là maintenant en 2026 tu doutes, tu es fatigué, tu penses à abandonner. Ne fais pas ça.\n\nCette idée de site que tu es en train de faire avec ton CTO, c'est ça qui va tout changer. Continue.\n\nEn 2030 on est millionnaire. On a aidé notre famille. Maman est fière.\n\nTiens bon 1 an encore. Je t'attends ici.\n\n- Toi, du futur.`,

`Yo ${nom} ! C'est le futur toi.\n\nFrère tu as réussi ! Tu te souviens quand tu n'avais rien à Lubumbashi ? Maintenant regarde nous.\n\nLa voiture que tu voulais, tu l'as. La maison, tu l'as.\n\nMais le plus important : tu n'as pas abandonné quand tout le monde se moquait de toi.\n\nJe suis fier de toi. Continue de coder, continue JORA.\n\nOn se voit bientôt au sommet.\n\nTon futur toi qui a gagné.`,

`Mon petit ${nom},\n\nC'est moi, toi dans 4 ans.\n\nJe voulais juste te dire merci. Merci de ne pas avoir écouté ceux qui disaient que tu ne vas rien faire.\n\nAujourd'hui en 2030, tu es une référence. Les jeunes de ta ville te prennent en exemple.\n\nTout a commencé avec ce petit site que tu fais là maintenant.\n\nAlors sèche tes larmes, relève-toi et bosse. Ton futur est grand.\n\nJe t'aime et je te fais confiance.\n\n- Le ${nom} de 2030 qui a réussi.`
];

let msg=messages[base%messages.length];
res.innerHTML=`
<div class=letter>
<div id=type class=typing>${msg}</div>
<br><br>
<button style=background:#000;color:#fff;width:100%;margin-top:10px;border:1px solid #333 onclick=partager()>📲 Partager ce message</button>
<button style=background:#fff;color:#000;width:100%;margin-top:10px onclick=location.reload()>🔄 Recevoir un autre</button>
</div>
`;
typeWriter(msg);
window.finalMsg=`📩 MESSAGE DE MON MOI DE 2030 (JORA)\n\n${msg}\n\nReçois ton message ici: https://kirikoulepetit48-lang.github.io/Futur.html`;
},2000);
}

function typeWriter(text){
let i=0;
let el=document.getElementById('type');
el.innerHTML='';
let interval=setInterval(()=>{
el.innerHTML=text.substring(0,i)+'<span style=background:#00ff88>|</span>';
i++;
if(i>text.length){clearInterval(interval); el.innerHTML=text;}
},20);
}

function partager(){
window.open('https://wa.me/?text='+encodeURIComponent(window.finalMsg),'_blank');
}
</script>
</body>
</html>
